name: ci

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          base=""
          head="${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
          fi

          # 手动触发、首个推送或无法可靠比较时保守地运行全部检查。
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! changed_paths="$(git diff --name-only "$base" "$head")"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$changed_paths" ]] || printf '%s\n' "$changed_paths" | grep -Ev '(^docs/|\.md$)' >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  repo-hygiene:
    name: repo-hygiene
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Scan workspace junk (dry-run)
        # scan --ci 默认把报告写入系统临时区（os.tmpdir()/rk3288_opencv-clean-scan/<runId>，
        # 随机 runId 无法被 upload-artifact 定位）；显式 --output-dir 指向 runner.temp
        # 固定位置，供下方 Upload cleanup reports 上传（Q4-8）。
        run: node scripts/clean-repo-junk.js scan --ci --output-dir "${{ runner.temp }}/cleanup-scan"
      - name: Run JNI sync audit (gate)
        # 纯 Node，无第三方依赖；脚本对 Java/C++ 侧 JNI 符号不一致返回非零退出码阻断
        run: node scripts/jni-sync-audit.js
      - name: Run workflow action pins gate (SEC-14)
        # 纯 Node，无第三方依赖且不发起网络（正则/长度校验，离线可跑）；
        # workflow 的 uses 若含可移动引用（tag/branch/短 SHA）返回非零退出码阻断
        run: node scripts/check-workflow-pins.js
      - name: Run scripts contract tests (all tests/scripts/*.test.js)
        # 目录级接入：glob 覆盖全部 tests/scripts/*.test.js（含 jni-sync-audit，
        # 现有 8 个文件共 29 个用例），新增治理测试无需逐个修改 CI（Q4-8）。
        run: node --test tests/scripts/*.test.js
      - name: Install pytest (quantize pairing tests)
        # ubuntu 24.04 系统 Python 为 PEP 668 externally-managed，需 --break-system-packages；
        # --user 避免以非 root runner 写系统 site-packages 失败。
        run: python3 -m pip install --quiet --user --break-system-packages pytest
      - name: Run quantize pairing tests (pytest)
        run: python3 -m pytest tests/scripts/test_quantize_ncnn_int8_pairing.py -q
      - name: Upload cleanup reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cleanup-reports
          path: |
            ${{ runner.temp }}/cleanup-scan
          if-no-files-found: ignore

  unit-tests:
    name: unit-tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # 本 job 已降级为「非门禁的参考信号」（job 级 continue-on-error）：
    # 1) 为什么降级——开发目标已收窄为 Android + Windows（见 AGENTS.md / CLAUDE.md 的
    #    「开发目标平台」一节），Linux/GCC 侧不再作为验收依据。
    # 2) 为什么不删除 job——它的 name 仍在经典分支保护
    #    （required_status_checks.contexts=["repo-hygiene","unit-tests"]）与仓库 ruleset
    #    的 required checks 中；直接删掉会让每个 PR 永久卡在
    #    「Expected — waiting for status to be reported」。
    # 3) 覆盖不丢——`windows` job 同样构建并运行 core_unit_tests。
    # ⚠️ 不确定性：job 级 continue-on-error 会让该 job 对分支保护报告 success，此行为来自
    #    actions/toolkit issue #1739 / #581 的实测报告，不是 GitHub 官方文档的明文承诺。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure (skip OpenCV)
        run: cmake -S . -B build_ci -G "Ninja" -DRK_SKIP_OPENCV=ON -DRK_BUILD_CORE_UNIT_TESTS=ON
      - name: Build core_unit_tests
        run: cmake --build build_ci --target core_unit_tests -j 2
      - name: Run tests
        run: ctest --test-dir build_ci --output-on-failure

      - name: Install OpenCV headers (cross-platform smoke test)
        run: sudo apt-get install -y libopencv-dev

      - name: Compile-check cross-platform source files
        run: |
          CXXFLAGS="-std=c++17 -c -o /dev/null -Isrc/win/include -Isrc/cpp/include $(pkg-config --cflags opencv4)"
          g++ $CXXFLAGS src/win/src/FaceDetector.cpp
          g++ $CXXFLAGS src/win/src/LbphEmbedder.cpp
          g++ $CXXFLAGS src/win/src/DnnSsdFaceDetector.cpp

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-unit-tests-reports
          path: build_ci/Testing/
          if-no-files-found: ignore

  docs-audit:
    name: docs-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run docs-sync-audit gate
        # docs-sync 门禁为治理红线：脚本要求 high=0 且 medium=0（不满足时退出码 2 阻断）。
        # --skip-links 跳过外部链接 HTTP 检查（网络慢且易抖动），只做仓库内文档同步门禁；
        # 与 repo-hygiene/unit-tests 等不同，本 job 不因 docs_only 变更而跳过：
        # docs 变更正是此门禁的审查对象（其余 job 对 docs-only PR 全部跳过）。
        run: node scripts/docs-sync-audit.js --skip-links --out-dir tests/reports/docs-sync-audit
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-audit-reports
          path: tests/reports/docs-sync-audit/
          if-no-files-found: ignore

  web:
    name: web-build-test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        # 固定 pnpm 小版本（对应 web/pnpm-lock.yaml lockfileVersion 9.0 的 pnpm 9.x 主线），
        # 避免浮动版本（pnpm@9）导致 web job 行为漂移
        run: npm install -g pnpm@9.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Audit dependencies (High/Critical gate)
        # 依赖审计门禁：High/Critical 漏洞必须阻断本 job。
        # 已知豁免：GHSA-jmr9-qjv8-65gv（extract-zip symlink path traversal）——最新 2.0.1
        # 仍 vulnerable 无修复版本，仅 cypress dev 工具链使用（安装时解压二进制），运行时
        # 不受影响（获准豁免，记治理文件）。其余 high 阻断。
        run: |
          cd web && node -e "
            const {execSync}=require('child_process');
            let out='';
            try{out=execSync('pnpm audit --audit-level high --json --registry=https://registry.npmjs.org',{encoding:'utf8',stdio:['ignore','pipe','ignore']});}catch(e){out=String(e.stdout||'');}
            const d=JSON.parse(out);
            const adv=d.advisories||{};
            const exempt=new Set(['GHSA-jmr9-qjv8-65gv']);
            let nonExemptHigh=[];
            for(const [id,a] of Object.entries(adv)){
              if(a.severity==='high'){
                const ghsa=((a.url||'')+(a.references||'')).match(/GHSA-[a-z0-9]+(?:-[a-z0-9]+)*/i)?.[0]||'';
                if(!exempt.has(ghsa)) nonExemptHigh.push(id+': '+ghsa+' '+a.title);
              }
            }
            if(nonExemptHigh.length){console.error('High 漏洞（含非豁免）: '+JSON.stringify(nonExemptHigh));process.exit(1);}
            console.log('Audit OK: high 仅豁免 extract-zip（无修复版本，dev 工具链）');
          "

      - name: Lint
        run: cd web && pnpm lint

      - name: Unit tests (Vitest)
        # 单测失败必须阻断 job（不得 continue-on-error 吞掉失败）
        run: cd web && pnpm test

      - name: Upload Vitest JUnit report
        # 单测失败也必须能取到 junit 报告（失败可判别、可回放），故 if: always()
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-vitest-junit
          path: web/tests/reports/junit.xml
          if-no-files-found: ignore

      - name: Build
        run: cd web && pnpm build

      - name: Test (E2E)
        # E2E 失败不阻断 job（历史决策），但 coverage 报告仍需尽力生成。
        # 插桩语义（vite-plugin-istanbul v6）：web/vite.config.ts 仅在 CYPRESS_COVERAGE==='1'
        # 时注册 istanbul 插件，且该插件 apply 仅作用于 serve 命令——`vite build`/`vite preview`
        # 都不做转译插桩（build 产物永不含插桩代码）。因此 CI 必须与本地 run-web-e2e.ps1 一致，
        # 用 dev server + CYPRESS_COVERAGE=1 提供插桩后的代码，才能让 coverage 报告有数据。
        continue-on-error: true
        env:
          # 与 dev server 实际端口（127.0.0.1:5173）对齐；默认值即 5173，显式给出以防配置漂移
          CYPRESS_BASE_URL: "http://127.0.0.1:5173"
        run: |
          cd web
          # 直接调用 vite 二进制而非 `pnpm run dev -- --host ...`：pnpm 各版本对 `--` 分隔符
          # 的透传语义不一致（pnpm 10 会把 "--" 原样传给脚本导致 --host 被忽略），
          # 直接调用保证 --host/--port 生效并绑定 127.0.0.1（与 baseUrl 对齐）。
          CYPRESS_COVERAGE=1 node_modules/.bin/vite --host 127.0.0.1 --port 5173 > /tmp/preview.log 2>&1 &
          DEV_PID=$!
          # 轮询等待 dev server 就绪（最多 60s），避免固定 sleep 的启动竞态
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # 就绪失败必须显式失败而非静默继续：否则 vite 未启动时 cypress 空跑、
          # coverage 静默为空（continue-on-error 掩盖）——输出 vite 日志便于排查（S3 CONFIRMED P2）
          if ! curl -sf http://127.0.0.1:5173 >/dev/null 2>&1; then
            echo "vite dev server 未就绪，E2E 将空跑；日志如下："
            cat /tmp/preview.log || true
            exit 1
          fi
          pnpm e2e:run:coverage || echo "E2E tests failed but continuing..."
          pnpm coverage:report || echo "coverage:report failed but continuing..."
          kill $DEV_PID || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage-reports
          path: |
            web/coverage/
            web/cypress/videos/
            web/cypress/screenshots/
            /tmp/preview.log
          if-no-files-found: ignore

  android:
    name: android-build-test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Configure Gradle timeouts
        run: |
          mkdir -p ~/.gradle
          echo "systemProp.org.gradle.internal.http.connectionTimeout=60000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=60000" >> ~/.gradle/gradle.properties
      - name: Build and Test (Skip OpenCV)
        run: ./gradlew -PRK_SKIP_OPENCV=true :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon

      # native-lib.cpp 语法检查（非阻断）——闭合「真实 JNI 实现从未被任何 CI job 编译」的盲区。
      # 背景：`native-lib` target 只在 Android 构建（cmake/android.cmake），且本 job 传
      # -PRK_SKIP_OPENCV=true ⇒ 只编 native-lib-stub.cpp；src/cpp/native-lib.cpp 的真实实现
      # （8703e83 新增的每线程 JNIEnv 缓存 / jclass-jmethodID 缓存 / NewLocalRef-DeleteLocalRef
      # 引用管理）从未被编译过，也从未被运行过。
      # 为何放在本 job：该文件 `#include <android/native_window.h>`（第 15 行，无条件）与 `<jni.h>`，
      # 只有本 job 具备真实 NDK 头（native-lib-stub.cpp 同样 include <jni.h>/<android/log.h>，
      # 故本 job 的 Gradle 构建必然已就位 NDK）；OpenCV 头由 libopencv-dev 提供。unit-tests job
      # 虽有真 OpenCV 却无 NDK（无 android/ 头），无法直接覆盖本文件。
      # 为何只做 -fsyntax-only 而不整编：本文件自身零 cv:: 代码，但其传递包含链
      # Engine.h → VideoManager.h → <opencv2/opencv.hpp> 强制要求完整 OpenCV 头，因此只做
      # 解析/语义检查、不生成代码也不链接。
      # ⚠️ 能力边界（勿高估本 step，勿再宣称它能抓运行期回归）：
      #   它捕捉的是【编译期】问题——头文件解析失败、标识符/签名/类型不匹配、预处理配置错
      #   （宏未定义、包含路径错）。
      #   它【不覆盖】运行期语义：NewLocalRef/DeleteLocalRef 引用计数、局部引用泄漏、
      #   jclass/jmethodID 缓存失效（IsSameObject）判定逻辑、g_activity 之类的
      #   use-after-delete 悬挂引用——这些在 -fsyntax-only 下根本不执行，编译器也无从检查。
      #   因此 8703e83 那批 JNI 引用管理改动，本 step【只能证明其可编译】，【不能】证明其行为
      #   正确；后者必须靠真机运行或运行期验证（如 adb logcat + 引用表/内存观察）才能发现。
      # ⚠️ 配置边界（勿误以为 CI 已覆盖 Android 真实配置）：
      #   本 step 用【宿主 g++ + 宿主 glibc/libstdc++ + 系统 libopencv-dev + NDK 头】的混合组合；
      #   【不传】-D__ANDROID__、不指定 ABI/API level、不定义 RK_HAVE_*（MPP/ncnn/libyuv 等）。
      #   即它验证的【不是】生产 Android 的交叉编译配置，只能抓粗粒度编译错；真实 Android 配置
      #   仍以本 job 的 ./gradlew :app:assembleDebug 与真机构建为准。
      # 为何非阻断（step 级 continue-on-error）：本机无等价环境，转正条件为先观察一轮全绿
      # （与本 job 内 rk3288_cli 的既有先例一致）。
      - name: Compile-check native-lib.cpp (non-blocking, closes the "never compiled" blind spot)
        id: check_native_lib_compile
        continue-on-error: true
        run: |
          set -euo pipefail

          # OpenCV 头（opencv2/opencv.hpp / opencv2/core/ocl.hpp）——经 Engine.h → VideoManager.h
          # 传递依赖；libopencv-dev 同时提供 pkg-config 的 opencv4.pc。
          # 安装失败视为【环境未就绪】(apt 临时故障等)：打 ::notice:: 并以成功结束，避免把环境
          # 问题误报成代码回归（与下面 NDK 缺失同一口径）。保留完整安装（不加
          # --no-install-recommends）：宁可多装，也不因缺头把环境问题伪装成「编译失败」。
          if ! sudo apt-get update -qq || ! sudo apt-get install -y -qq libopencv-dev; then
            echo "::notice::环境未就绪：libopencv-dev 安装失败（apt 临时故障？）——跳过 native-lib.cpp 语法检查（非代码问题）。"
            echo ':grey_exclamation: **native-lib.cpp 语法检查被跳过（环境未就绪）** —— libopencv-dev 安装失败，非代码回归。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 定位 Android NDK 的 sysroot include（jni.h + android/native_window.h 所在）。
          # 优先环境变量，其次扫描 SDK 的 ndk/ 目录（AGP 会在此安装它需要的版本）。
          SYSROOT_REL="toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"
          if [ -z "$NDK" ] || [ ! -f "$NDK/$SYSROOT_REL/android/native_window.h" ]; then
            NDK=""
            for cand in "${ANDROID_SDK_ROOT:-}"/ndk/* "${ANDROID_HOME:-}"/ndk/* /usr/local/lib/android/sdk/ndk/*; do
              if [ -f "$cand/$SYSROOT_REL/android/native_window.h" ]; then NDK="$cand"; fi
            done
          fi
          if [ -z "$NDK" ]; then
            # 环境未就绪，而非代码错：打 ::notice::（非 ::warning::）并成功结束，使「环境问题」与
            # 「代码真错」在 UI 与 outcome 上可区分（否则该 step 会长期只告警、掩盖真信号）。
            echo "::notice::环境未就绪：未找到 Android NDK（$SYSROOT_REL/android/native_window.h）——跳过 native-lib.cpp 语法检查（非代码问题）。"
            echo ':grey_exclamation: **native-lib.cpp 语法检查被跳过（环境未就绪）** —— 未找到 NDK 头，非代码回归；本 step 以成功结束，故不触发下方告警 step。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "使用 NDK sysroot include: $NDK/$SYSROOT_REL"

          # pkg-config 拿不到 opencv4 亦属环境未就绪（同口径）：避免因缺 OpenCV cflags 导致 g++ 报
          # 缺头、被误判成「代码编译失败」。
          if ! pkg-config --exists opencv4; then
            echo "::notice::环境未就绪：pkg-config 未找到 opencv4——跳过 native-lib.cpp 语法检查（非代码问题）。"
            echo ':grey_exclamation: **native-lib.cpp 语法检查被跳过（环境未就绪）** —— pkg-config opencv4 不可用，非代码回归。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 用 -idirafter（而非 -I/-isystem）挂 NDK 头：仅当宿主缺失某头时（jni.h / android/*）
          # 才回落到 NDK，标准 C 头仍取宿主 glibc/libstdc++，避免 bionic 与 glibc 头相互遮蔽。
          g++ -fsyntax-only -std=c++17 \
            -Isrc/cpp/include \
            -Isrc/cpp/include/adapters \
            -Isrc/win/include \
            -idirafter "$NDK/$SYSROOT_REL" \
            $(pkg-config --cflags opencv4) \
            src/cpp/native-lib.cpp
          echo "native-lib.cpp 语法检查通过（仅编译期：真实 OpenCV 头 + NDK jni.h/native_window.h；不覆盖 JNI 引用管理等运行期语义）。"

      # 失败可见化（对应上一 step 的 continue-on-error）。为什么单独加这一步：continue-on-error
      # 只保证「本 step 变红但不中止 job」，job 结论仍为 success，且无下游 step 消费其 outcome
      # ⇒ 真实编译回归只会在展开列表里留一个红叉。本步在上一 step outcome 为 failure 时把告警写进
      # job 的 Step Summary 并打 ::warning:: 注解，令该信号无法被忽略。
      # 信号区分：上一 step 的【环境未就绪】分支（NDK 缺失 / apt 或 pkg-config 不可用）已改为打
      # ::notice:: 并以成功结束 ⇒ 不会触发本 step。故【本告警出现 ⇒ 大概率是真实代码/配置问题】，
      # 而非环境噪声；这正是与「永久噪声掩盖真信号」相反的设计。
      # 取舍（显式选择：仅报警、不 exit 1）：native-lib.cpp 检查非门禁，本 job 无等价本地环境，
      # 转正条件为先观察一轮全绿；若本步也 exit 1 会令 job 变红并跳过后面的 Upload Artifacts，
      # 与「用 continue-on-error 保护的初衷」相矛盾。
      - name: Warn if native-lib.cpp failed to compile (visible, non-blocking)
        if: steps.check_native_lib_compile.outcome == 'failure'
        run: |
          {
            echo ':warning: **native-lib.cpp 语法检查失败（编译期错误）** —— 这是「native-lib 真实实现从未在 CI 编译」盲区被点亮的信号，请检查而非忽略。'
            echo ''
            echo '该文件是 Android JNI 真实实现（8703e83 含每线程 JNIEnv 缓存、jclass/jmethodID 缓存与'
            echo 'NewLocalRef/DeleteLocalRef 引用管理）；此前仅 native-lib-stub.cpp 参与 CI，真实实现从未被任何 job 编译。'
            echo ''
            echo '**本 step 的能力边界**：失败 ⇒ 编译期问题（头文件解析 / 标识符 / 签名 / 类型 / 预处理配置）；'
            echo '它**不能**证明或否认运行期语义（引用计数、局部引用泄漏、缓存失效、use-after-delete）——'
            echo '后者需真机运行期验证。'
            echo ''
            echo '**如何区分环境与代码**：环境未就绪（NDK 缺失 / apt 或 pkg-config 不可用）已改为打 ::notice::'
            echo '并以成功结束、不触发本告警。因此【出现本告警 ⇒ 删掉环境噪声后大概率是真实代码/配置问题】，请定位并修复。'
            echo ''
            echo '本告警**不阻断** job（有意取舍：先观察一轮全绿再考虑转正为门禁）。'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=native-lib.cpp compile check failed::native-lib.cpp failed -fsyntax-only in CI - likely a real compile-time error (env-not-ready cases downgraded to ::notice::); see job summary."

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/outputs/
          if-no-files-found: ignore

  windows:
    name: windows-build-test
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      needs.changes.outputs.docs_only != 'true'
    needs: changes
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      OPENCV_VERSION: "4.10.0"
      OPENCV_CONTRIB_VERSION: "4.10.0"
      DEPS_DIR: _deps
      BUILD_DIR: build_ci_win
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_PLATFORM: x64
      CMAKE_BUILD_CONFIG: Release
      # Must match RK_OPENCV_FULL_LIBS in cmake/opencv.cmake (minus "opencv_" prefix).
      # Currently: core imgproc imgcodecs objdetect features2d flann calib3d dnn ml photo face video videoio highgui stitching
      OPENCV_BUILD_LIST: "core,imgproc,imgcodecs,objdetect,features2d,flann,calib3d,dnn,ml,photo,face,video,videoio,highgui,stitching"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: clean-repo-junk dry-run scan (CI)
        shell: pwsh
        run: |
          node --version
          node scripts/clean-repo-junk.js scan --ci

      - name: Cache _deps (opencv sources, GTest build)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.DEPS_DIR }}
            ${{ env.BUILD_DIR }}/_deps/googletest-build
          key: deps-${{ runner.os }}-opencv-${{ env.OPENCV_VERSION }}-contrib-${{ env.OPENCV_CONTRIB_VERSION }}-v1
          restore-keys: |
            deps-${{ runner.os }}-opencv-${{ env.OPENCV_VERSION }}-contrib-${{ env.OPENCV_CONTRIB_VERSION }}-
            deps-${{ runner.os }}-opencv-

      - name: Fetch OpenCV + opencv_contrib sources into _deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repoRoot = $env:GITHUB_WORKSPACE
          $deps = Join-Path $repoRoot $env:DEPS_DIR
          New-Item -ItemType Directory -Force -Path $deps | Out-Null

          function Ensure-Repo {
            param(
              [Parameter(Mandatory=$true)][string]$RepoUrl,
              [Parameter(Mandatory=$true)][string]$DestDir,
              [Parameter(Mandatory=$true)][string]$Ref
            )
            if (-not (Test-Path (Join-Path $DestDir ".git"))) {
              Write-Host "Cloning $RepoUrl ($Ref) -> $DestDir"
              git clone --depth 1 --branch $Ref $RepoUrl $DestDir
              return
            }
            Write-Host "Reusing cached repo: $DestDir"
            git -C $DestDir fetch --depth 1 origin $Ref
            git -C $DestDir checkout --force $Ref
          }

          $opencvDir = Join-Path $deps "opencv"
          $opencvContribDir = Join-Path $deps "opencv_contrib"

          Ensure-Repo -RepoUrl "https://github.com/opencv/opencv.git" -DestDir $opencvDir -Ref $env:OPENCV_VERSION
          Ensure-Repo -RepoUrl "https://github.com/opencv/opencv_contrib.git" -DestDir $opencvContribDir -Ref $env:OPENCV_CONTRIB_VERSION

          "OPENCV_ROOT=$opencvDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENCV_CONTRIB_ROOT=$opencvContribDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "OPENCV_ROOT=$opencvDir"
          Write-Host "OPENCV_CONTRIB_ROOT=$opencvContribDir"

      - name: Configure (CMake)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          cmake -S . -B $env:BUILD_DIR -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_PLATFORM `
            -DOPENCV_ROOT="$env:OPENCV_ROOT" `
            -DOPENCV_CONTRIB_ROOT="$env:OPENCV_CONTRIB_ROOT" `
            -DBUILD_LIST="$env:OPENCV_BUILD_LIST"

      - name: Build unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 构建单元测试套件 + win_replay_export_cli（仅编译，不运行）。
          # win_face_database_perf 是性能基准（约 80s 且依赖 OpenCV FileStorage 往返，
          # 环境敏感），不参与 PR 门禁。
          # 为何纳入这个 CLI：它是「视频 → 检测序列」导出器，源码不被任何单测 target 引用
          # （其序列化器部分由 core_unit_tests 覆盖，CLI 外壳自身没有）。不在此编译，它的
          # 编译期错误会一路静默到有人本地全量构建——本 job 已具备完整 OpenCV，增量成本低。
          cmake --build $env:BUILD_DIR --config $env:CMAKE_BUILD_CONFIG --target core_unit_tests win_unit_tests face_infer_unit_tests core_gtest_tests win_replay_export_cli -- /m

      # 单独编译 rk3288_cli（非阻断）。为何独立成 step 而不并入上面主构建行的 --target 清单：
      # GitHub Actions 中一个 step 失败会中止整个 job，排在其后的测试 step 会被跳过——若 rk3288_cli
      # 在 CI 的源/工具链组合下编不过，会连带丢掉既有的、有价值的测试覆盖，属净损失。故此处用
      # continue-on-error 兜底：编不过只作提示，不中止 job、不影响后续 ctest。该 target 位于
      # CMakeLists.txt 的 if(NOT RK_SKIP_OPENCV) 块内，曾被所有 CI job 零覆盖，且曾因
      # EventManager.h 传递依赖 <gtest/gtest_prod.h> 触发 C1083（因 CI 从不编译它而长期静默）；
      # 本步用于消除这一「从未在 CI 编译」的盲区。
      # 转正条件：连续观察一轮全绿（本步稳定通过）后，可将其并入上方主构建行的 --target 清单。
      - name: Build rk3288_cli (non-blocking, closes the "never compiled in CI" blind spot)
        id: build_rk3288_cli
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build $env:BUILD_DIR --config $env:CMAKE_BUILD_CONFIG --target rk3288_cli -- /m

      # 失败可见化（本步对应上一本步的 continue-on-error）。为什么单独加这一步：continue-on-error
      # 只保证「本 step 变红但不中止 job」，job 结论仍为 success，且**无任何下游 step 消费其 outcome**
      # ⇒ 真实编译回归只会在上一步的展开列表里留一个红叉，扫 checks 状态的人看不到（「盲区已闭合」仅
      # 纸面成立）。本步在上一步 outcome 为 failure 时，把告警写进 job 的 Step Summary（run 页面顶部
      # 可见）并打 ::warning:: 注解，令该信号无法被忽略。
      #
      # 取舍（显式选择①：**仅报警、不 exit 1**）：若本步也失败，job 会变红并跳过其后的 ctest，
      # 牺牲既有测试覆盖——这与「用 continue-on-error 保护的初衷」自相矛盾。rk3288_cli 非门禁
      # target，其构建失败可由人从 summary 感知并跟进，故此处选择「可见但不阻断」，真正的门禁仍是
      # ctest 与其它 required checks。
      - name: Warn if rk3288_cli failed to compile (visible, non-blocking)
        if: steps.build_rk3288_cli.outcome == 'failure'
        shell: pwsh
        run: |
          $lines = @(
            ':warning: **rk3288_cli 在 CI 上编译失败** —— 这是「零覆盖盲区被点亮」的信号，请检查而非忽略。',
            '',
            '该 target 曾因 `EventManager.h` 传递依赖 `<gtest/gtest_prod.h>` 触发 C1083，且长期未被任何',
            'CI job 编译（本步即为消除该盲区而加）。**请定位并修复**，或确认是环境噪声后重跑。',
            '',
            '本告警**不阻断** job：后续 ctest 仍会正常运行（这是有意的取舍——保护既有测试覆盖）。'
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")
          Write-Host "::warning title=rk3288_cli build failed::rk3288_cli failed to compile in CI — see job summary; coverage-gap signal, please investigate."

      - name: Run ctest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 仅运行单元测试套件，排除性能基准 win_face_database_perf
          ctest --test-dir $env:BUILD_DIR -C $env:CMAKE_BUILD_CONFIG -R "unit_tests|core_gtest_tests" --output-on-failure

      - name: Check for model/quantize changes
        id: changed-int8
        shell: pwsh
        run: |
          try {
            $baseSha = "${{ github.event.pull_request.base.sha }}"
            $headSha = "${{ github.event.pull_request.head.sha }}"
            if ([string]::IsNullOrEmpty($baseSha)) {
              "changed=true" >> $env:GITHUB_OUTPUT
              Write-Host "Not a PR — running INT8 steps"
              return
            }
            $diff = git diff --name-only $baseSha $headSha
            if ($LASTEXITCODE -eq 0) {
              $changed = $diff
            } else {
              $changed = git diff --name-only HEAD~1..HEAD
            }
            $matched = ($changed | Select-String -Pattern '^models/' -Quiet)
            if (-not $matched) { $matched = ($changed | Select-String -Pattern '^scripts/quantize_ncnn_int8\.py' -Quiet) }
            if (-not $matched) { $matched = ($changed | Select-String -Pattern '^deps/WIDER_train/' -Quiet) }
            $int8Changed = if ($matched) { "true" } else { "false" }
            Write-Host "INT8 changed=$matched"
            if ($env:GITHUB_OUTPUT) { "changed=${int8Changed}" >> $env:GITHUB_OUTPUT }
          } catch {
            Write-Host "INT8 detection failed: $_"
            if ($env:GITHUB_OUTPUT) { "changed=true" >> $env:GITHUB_OUTPUT }
          }

      - name: Quantize models (INT8)
        if: steps.changed-int8.outputs.changed == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/quantize_ncnn_int8.py `
            --model scrfd `
            --fp32-dir "models/scrfd_ncnn" `
            --calib-dir "deps/WIDER_train/WIDER_train/images" `
            --output-dir "models/scrfd_int8_ncnn" `
            --size 640 `
            --num-samples 50

      - name: Run INT8 precision tests
        if: steps.changed-int8.outputs.changed == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir $env:BUILD_DIR -C $env:CMAKE_BUILD_CONFIG -R face_infer --output-on-failure

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unit-tests-reports
          path: ${{ env.BUILD_DIR }}/Testing/
          if-no-files-found: ignore
