name: docs-audit

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: docs-audit-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs-audit:
    name: docs-sync-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test Docs Sync Audit
        # 用 glob 覆盖 docs-sync-audit 的全部测试文件（含 -gate 端到端与 -selfcheck
        # 真实仓库门禁断言）。此前只点名 docs-sync-audit.test.js，而 ci.yml 的
        # repo-hygiene job 带 docs_only != 'true' 条件，导致 docs-only PR 上
        # 两个测试文件均不执行。
        run: node --test tests/scripts/docs-sync-audit*.test.js

      - name: Run Docs Sync Audit
        # 与 ci.yml 的 docs-audit job 命令保持一致：--skip-links（本地可验证、内部一致性
        # 门禁）；--link-cache 会验证外部 URL，CI 网络波动/失效会误报 medium（本地无法复现）。
        run: node scripts/docs-sync-audit.js --skip-links --out-dir tests/reports/docs-sync-audit

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-audit-reports
          path: tests/reports/docs-sync-audit/
          if-no-files-found: ignore
